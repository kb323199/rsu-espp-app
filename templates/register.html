<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>註冊</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:400px">
  <h3 class="mb-4">建立帳號</h3>
  {% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
  <form method="POST">
    <div class="mb-3"><label class="form-label">帳號</label>
      <input name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">密碼（至少6字元）</label>
      <input name="password" type="password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">確認密碼</label>
      <input name="confirm" type="password" class="form-control" required></div>
    <button class="btn btn-success w-100">註冊</button>
  </form>
  <p class="mt-3 text-center">已有帳號？<a href="/login">登入</a></p>
</div>
</body></html>
