<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESPP 計算</title>
</head>
<body>
<h2>ESPP 計算</h2>
{% if error %}<div style="color:#991b1b">{{ error }}</div>{% endif %}
{% if message %}<div style="color:#166534">{{ message }}</div>{% endif %}
<form method="post">
    <label>認購日</label>
    <input name="purchase_date" type="date" required />
    <label>股票代號</label>
    <input name="ticker" required />
    <label>股數</label>
    <input name="shares" type="number" step="0.01" required />
    <button type="submit">計算並儲存</button>
</form>
{% if result %}
<h3>結果</h3>
<pre>{{ result }}</pre>
{% endif %}
<p><a href="/">回首頁</a></p>
</body>
</html>
