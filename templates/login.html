<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><title>登入</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:400px">
  <h3 class="mb-4">登入</h3>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}
  {% endwith %}
  {% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
  <form method="POST">
    <div class="mb-3"><label class="form-label">帳號</label>
      <input name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">密碼</label>
      <input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">登入</button>
  </form>
  <p class="mt-3 text-center">還沒有帳號？<a href="/register">立即註冊</a></p>
</div>
</body></html>
