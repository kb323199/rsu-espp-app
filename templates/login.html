<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入</title>
    <style>
        body{font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;padding:24px;background:#f4f6f9}
        .card{background:#fff;padding:20px;border-radius:10px;max-width:420px;margin:40px auto}
        input{width:100%;padding:10px;margin-bottom:12px}
        button{padding:10px 14px;background:#2563eb;color:#fff;border:none;border-radius:8px}
        .note{color:#6b7280}
    </style>
</head>
<body>
<div class="card">
    <h2>登入</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="note" style="color: {% if cat=='error' %}#991b1b{% else %}#166534{% endif %};">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
        <input name="username" placeholder="使用者名稱" required />
        <input name="password" type="password" placeholder="密碼" required />
        <input type="hidden" name="next" value="{{ next }}" />
        <button type="submit">登入</button>
    </form>
    <p class="note">還沒有帳號？ <a href="/register">註冊</a></p>
    <p class="note"><a href="/">返回首頁</a></p>
</div>
</body>
</html>
