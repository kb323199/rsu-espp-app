name: Keep Supabase Alive

on:
  schedule:
    # 每週日、三各跑一次（UTC 00:00），間隔小於 Supabase 7 天暫停門檻
    - cron: "0 0 * * 0,3"
  workflow_dispatch: {}  # 允許手動在 GitHub Actions 頁面點「Run workflow」測試

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary

      - name: Ping Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python keepalive.py
